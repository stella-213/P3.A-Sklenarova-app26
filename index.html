<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>MysteryBox CZ</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
}

.container {
    width: 400px;
    margin: auto;
    background: #2c2c54;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    color: gold;
}

.box {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

input {
    padding: 5px;
}

.form {
    margin-top: 15px;
    text-align: left;
}

.form input {
    width: 100%;
    margin-bottom: 8px;
}

button {
    margin-top: 10px;
    padding: 10px;
    background: gold;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: orange;
}

.total {
    margin-top: 15px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🎁 MysteryBox CZ</h1>
    <p>Vyber si svůj box</p>

    <div class="box">
        MALÝ BOX (45 Kč)
        <input type="number" id="small" value="0" min="0">
    </div>

    <div class="box">
        STŘEDNÍ BOX (65 Kč)
        <input type="number" id="medium" value="0" min="0">
    </div>

    <div class="box">
        VELKÝ BOX (85 Kč)
        <input type="number" id="large" value="0" min="0">
    </div>

    <div class="box">
        MAXI BOX (100 Kč)
        <input type="number" id="maxi" value="0" min="0">
    </div>

    <div class="total">
        Celková cena: <span id="total">0</span> Kč
    </div>

    <button onclick="spocitej()">Spočítat cenu</button>

    <!-- NOVÁ POLE -->
    <div class="form">
        <label>VAŠE JMÉNO (Příjmení Jméno):</label>
        <input type="text" id="jmeno" placeholder="Novák Jan">

        <label>TELEFON (+420 000 000 000):</label>
        <input type="text" id="telefon" placeholder="+420 123 456 789">
    </div>

    <button onclick="odeslat()">ODESLAT OBJEDNÁVKU</button>
</div>

<script>

function spocitej() {
    let small = Number(document.getElementById("small").value);
    let medium = Number(document.getElementById("medium").value);
    let large = Number(document.getElementById("large").value);
    let maxi = Number(document.getElementById("maxi").value);

    let total = small*45 + medium*65 + large*85 + maxi*100;
    document.getElementById("total").innerText = total;
}

function odeslat() {

    spocitej(); // přepočítá cenu

    let jmeno = document.getElementById("jmeno").value.trim();
    let telefon = document.getElementById("telefon").value.trim();

    if (jmeno === "" || telefon === "") {
        alert("Vyplň jméno a telefon!");
        return;
    }

    let small = Number(document.getElementById("small").value);
    let medium = Number(document.getElementById("medium").value);
    let large = Number(document.getElementById("large").value);
    let maxi = Number(document.getElementById("maxi").value);
    let total = document.getElementById("total").innerText;

    let text = `
OBJEDNÁVKA MYSTERY BOX

Zákazník: ${jmeno}
Telefon: ${telefon}

Malý box (45 Kč): ${small} ks = ${small*45} Kč
Střední box (65 Kč): ${medium} ks = ${medium*65} Kč
Velký box (85 Kč): ${large} ks = ${large*85} Kč
Maxi box (100 Kč): ${maxi} ks = ${maxi*100} Kč

CELKEM: ${total} Kč
`;

    let mail = "mailto:app@kostka-skola.cz"
        + "?subject=" + encodeURIComponent("Objednávka MysteryBox")
        + "&body=" + encodeURIComponent(text);

    window.location.href = mail;
}

</script>

</body>
</html>
``
