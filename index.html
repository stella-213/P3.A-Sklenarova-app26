<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>MysteryBox CZ</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
}

.container {
    width: 420px;
    margin: auto;
    background: #2c2c54;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    color: gold;
}

.box {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

input {
    padding: 5px;
}

.form {
    margin-top: 15px;
    text-align: left;
}

.form input {
    width: 100%;
    margin-bottom: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
    background: gold;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: orange;
}

.total {
    margin-top: 10px;
    font-size: 18px;
}
</style>
