<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>MysteryBox CZ</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    text-align: center;
}

.container {
    width: 420px;
    margin: auto;
    background: #2c2c54;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    color: gold;
}

.box {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

input {
    padding: 5px;
}

.form {
    margin-top: 15px;
    text-align: left;
}

.form input {
    width: 100%;
    margin-bottom: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
    background: gold;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: orange;
}

.total {
    margin-top: 10px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
<h1>🎁 MysteryBox CZ</h1>

<div class="box">
MALÝ BOX (45 Kč)
<input type="number" id="small" value="0" min="0">
</div>

<div class="box">
STŘEDNÍ BOX (65 Kč)
<input type="number" id="medium" value="0" min="0">
</div>

<div class="box">
VELKÝ BOX (85 Kč)
<input type="number" id="large" value="0" min="0">
</div>

<div class="box">
MAXI BOX (100 Kč)
<input type="number" id="maxi" value="0" min="0">
</div>

<div class="total">
Celková cena: <span id="total">0</span> Kč
</div>

<button onclick="spocitej()">Spočítat cenu</button>

<!-- FORMULÁŘ -->
<div class="form">
<label>VAŠE JMÉNO (Příjmení Jméno):</label>
<input type="text" id="jmeno" placeholder="Novák Jan">

<label>TELEFON (např. +420 123 456 789):</label>
<input type="text" id="telefon" placeholder="+420 123 456 789">
</div>

<button onclick="odeslat()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>
function spocitej() {
    let small = document.getElementById("small").value;
    let medium = document.getElementById("medium").value;
    let large = document.getElementById("large").value;
    let maxi = document.getElementById("maxi").value;

    let total = small*45 + medium*65 + large*85 + maxi*100;

    document.getElementById("total").innerText = total;
}

function odeslat() {

    let jmeno = document.getElementById("jmeno").value;
    let telefon = document.getElementById("telefon").value;

    if (jmeno === "" || telefon === "") {
        alert("Vyplňte jméno i telefon!");
        return;
    }

    let small = document.getElementById("small").value;
    let medium = document.getElementById("medium").value;
    let large = document.getElementById("large").value;
    let maxi = document.getElementById("maxi").value;

    let total = document.getElementById("total").innerText;

    let text = 
    "OBJEDNÁVKA MYSTERY BOX%0D%0A%0D%0A" +

    "Zákazník: " + jmeno + "%0D%0A" +
    "Telefon: " + telefon + "%0D%0A%0D%0A" +

    "Objednané položky:%0D%0A" +

    "Malý box (45 Kč) - " + small + " ks = " + (small*45) + " Kč%0D%0A" +
    "Střední box (65 Kč) - " + medium + " ks = " + (medium*65) + " Kč%0D%0A" +
    "Velký box (85 Kč) - " + large + " ks = " + (large*85) + " Kč%0D%0A" +
    "Maxi box (100 Kč) - " + maxi + " ks = " + (maxi*100) + " Kč%0D%0A%0D%0A" +

    "Celková cena: " + total + " Kč";

    window.location.href = "mailto:app@kostka-skola.cz?subject=Objednávka MysteryBox&body=" + text;
}
</script>

</body>
</html>
